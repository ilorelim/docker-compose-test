services:
  api:
    build: ./api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - app_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - app_network
    restart: unless-stopped

volumes:
  redis_data:
networks:
  app_network:
    driver: bridge
